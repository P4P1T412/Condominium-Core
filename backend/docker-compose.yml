services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-${DB_PASSWORD:?Define DB_PASSWORD en backend/.env}}
      APP_USER: ${DB_USER:?Define DB_USER en backend/.env}
      APP_USER_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en backend/.env}
    volumes:
      - oracle_data:/opt/oracle/oradata
      # Docker montará tus scripts y los ejecutará automáticamente al crear el contenedor:
      - ../database/ddl:/container-entrypoint-initdb.d

volumes:
  oracle_data: